# 证道终端 · 版本目录
#
# 只放骨架需要的：AGP / Kotlin / Compose / AndroidX 基础件。
#
# ⚠️ 库版本为什么比主仓旧：派工单把 compileSdk 钉在 **36**，而主仓用的
# androidx.core 1.19 / Compose 1.12（BOM 2026.09）在 AAR 元数据里要求 **minCompileSdk 37**，
# 用它们会直接编译失败（即使强行绕过检查，运行时也会调到 API 36 上不存在的符号）。
# 所以这里取"最后一个还支持 compileSdk 36"的线：core-ktx 1.16 / activity 1.10 / BOM 2025.05。
# 等本仓整体抬到 SDK 37 时再与主仓对齐（那时是一次统一的版本升级，不是这里顺手改）。
# **刻意不引**任何第三方库（OkHttp、commons-compress、zstd 等）—— 那是终端内核搬入（第四刀）时的事，
# 骨架期多引一个依赖，就等于在"还没有终端"的仓里先背一份供应链债。
[versions]
agp = "9.4.0"
kotlin = "2.2.10"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
composeBom = "2025.05.01"
junit = "4.13.2"
# 单测里的 org.json 真实实现（android.jar 的 stub 一律 "not mocked"）
jsonVersion = "20240303"
# 终端内核（:terminal-core）要的：rootfs 下载/解压、PTY 依赖
okhttp = "4.12.0"
commonsCompress = "1.26.2"
commonsLang3 = "3.18.0"
zstdJni = "1.5.6-4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "jsonVersion" }
# 第二百四十八批（第四刀）：随终端内核一起进来的运行时依赖（版本与主仓一致）
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version.ref = "commonsLang3" }
zstd-jni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstdJni" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
# 入口页要跟着 ON_RESUME 刷新授权/安装状态（LocalLifecycleOwner 的官方载体）
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version = "2.8.7" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# 第二百四十八批：终端内核是个库模块（:terminal-core），需要 android-library 插件
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
